[package]
name = "retro64-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly browser frontend for the Retro 64 emulator."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
retro64-core = { path = "../retro64-core" }
wasm-bindgen = "0.2.118"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "KeyboardEvent",
    "Event",
    "EventTarget",
]
