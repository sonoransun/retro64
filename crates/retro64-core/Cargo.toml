[package]
name = "retro64-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent Commodore 64 emulation core."

[dependencies]
log = "0.4"
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1.3"
