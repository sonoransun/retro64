[package]
name = "retro64-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDL2 desktop frontend for the Retro 64 emulator."

[[bin]]
name = "retro64"
path = "src/main.rs"

[dependencies]
retro64-core = { path = "../retro64-core" }
sdl2 = { version = "0.37", default-features = false }
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[features]
default = []
bundled = ["sdl2/bundled", "sdl2/static-link"]
